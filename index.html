<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">Academic workspace</p>
                <h1>Student Task Manager</h1>
            </div>
            <button class="ghost-button" type="button" id="clear-all-btn">Clear all</button>
        </header>

        <main class="dashboard">
            <section class="stats-grid" aria-label="Dashboard statistics">
                <article class="stat-card accent-blue">
                    <span class="stat-label">Total tasks</span>
                    <strong class="stat-number" id="total-tasks">0</strong>
                </article>
                <article class="stat-card accent-green">
                    <span class="stat-label">Completed</span>
                    <strong class="stat-number" id="completed-tasks">0</strong>
                </article>
                <article class="stat-card accent-gold">
                    <span class="stat-label">Pending</span>
                    <strong class="stat-number" id="pending-tasks">0</strong>
                </article>
                <article class="stat-card accent-red">
                    <span class="stat-label">High priority</span>
                    <strong class="stat-number" id="high-priority-tasks">0</strong>
                </article>
            </section>

            <section class="panel task-panel">
                <div class="panel-header">
                    <h2 id="form-title">Add new task</h2>
                    <button class="text-button hidden" type="button" id="cancel-edit-btn">Cancel</button>
                </div>

                <form id="task-form">
                    <div class="form-grid">
                        <label class="field">
                            <span>Task title</span>
                            <input type="text" id="task-title" placeholder="E.g. Complete biology quiz" required />
                        </label>

                        <label class="field">
                            <span>Due date</span>
                            <input type="date" id="task-date" />
                        </label>

                        <label class="field full-width">
                            <span>Description</span>
                            <textarea id="task-description" rows="3"
                                placeholder="Add more details about this task..."></textarea>
                        </label>

                        <label class="field">
                            <span>Priority</span>
                            <select id="task-priority">
                                <option value="High">High</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="primary-button" id="submit-btn">Add task</button>
                    </div>
                </form>
            </section>

            <section class="panel list-panel">
                <div class="toolbar">
                    <div class="search-wrapper">
                        <label class="sr-only" for="search-input">Search tasks</label>
                        <input type="search" id="search-input" placeholder="Search tasks..." />
                    </div>

                    <div class="filter-group">
                        <label for="status-filter">Status</label>
                        <select id="status-filter">
                            <option value="all">All</option>
                            <option value="pending">Pending</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="priority-filter">Priority</label>
                        <select id="priority-filter">
                            <option value="all">All</option>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                </div>

                <div id="task-list" class="task-list" aria-live="polite"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
